# Nginx INTERNO da Clínica da Aprendizagem (atrás do Nginx central da VM).
# Sem TLS: o Nginx central termina o HTTPS e faz proxy para cá na porta 80.
# Serve o SPA (React/Vite) e faz proxy de /api,/admin para o backend Django;
# serve /static (admin/DRF) e /media (uploads) dos volumes compartilhados.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;  # anexos de pacientes (imagens/PDF)

    # API → Django/Gunicorn. Propaga o X-Forwarded-Proto vindo do proxy central
    # (https) para o Django enxergar HTTPS e não entrar em loop de redirect.
    location /api/ {
        proxy_pass http://clinica-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://clinica-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Estáticos do Django (admin/DRF/Swagger) — volume compartilhado com o backend.
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # Uploads do usuário (fotos de perfil, anexos de pacientes).
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    # Assets do build (Vite, com hash) — cache agressivo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback do SPA: qualquer rota desconhecida serve o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
