# CI/CD da Clínica da Aprendizagem (monorepo: back/ Django + front/ React).
#
# A cada push na main:
#   1) build das imagens Docker (backend e frontend) e push para o GHCR;
#   2) deploy na VPS via SSH: `docker compose pull && up -d` em /opt/clinica.
#
# O CMD da imagem backend roda `migrate` + `collectstatic` no start, então o
# recreate do container aplica as migrações automaticamente (banco = Postgres
# NATIVO da VPS, acessado via host.docker.internal).
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   VM_HOST     → 72.60.49.227
#   VM_USER     → root
#   VM_SSH_KEY  → chave privada do deploy key `github-actions-clinica`
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_BACKEND: ghcr.io/mnz19/sistema-clinica-aprendizagem/backend
  IMAGE_FRONTEND: ghcr.io/mnz19/sistema-clinica-aprendizagem/frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend (Django) ---------------------------------------------------
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # --- Frontend (SPA React/Vite servido por Nginx) ------------------------
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/clinica
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
